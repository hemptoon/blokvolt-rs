var BVQ=window.BVQ=window.BVQ||[];BVQ.push(["en2","1wf3ia7§Public chargers · Serbia§1wbuqvc§Charging map for electric cars§f8nbh5§Fast DC and AC chargers on one map — with each network’s price, date and source.§19w49du§Charging map for electric cars in Serbia — with prices | Evolako§kbrkuv§How to read the map§th2gsx§A dark circle is a fast DC charger, a blue one is AC, and the number inside is the power in kW. A grey circle means the charger isn’t working or is for Tesla vehicles only. A faded circle is a charger that is only in the open databases — we didn’t find it on a network’s list or in recent driver ratings, so check it before you set off.§ay1nj1§Zoom in and the price per kWh appears under each charger. Networks mostly charge by the minute, so this is an estimate for a typical car; the exact price list, date and source are in the charger’s card.§1945ywb§Where the data comes from§drhhgy§Chargers come from the open databases OpenStreetMap (ODbL) and Open Charge Map (CC BY 4.0), from the networks’ lists and from JP “Putevi Srbije”. Prices come from the networks’ price lists and apps, always with a date and a source. The database is kept by§4zpbkj§— a guide to electric cars in Serbia run by the same team, and the map is refreshed once a month. If you spot a mistake, open the charger and choose “Report an error”.§15a2amz§What public charging costs§1u11sal§Converted per kWh, fast (DC) charging in Serbia most often comes to 60–70 RSD, with a range of roughly 45–95 RSD depending on the network, the charger’s power and the car (network price lists, September 2026). At home, at night, the same kWh is about 6 RSD with all fees included, as in the calculator on this site.§1wlavls§A charger in your building’s garage§18xaj63§If you park in your building’s garage, the charger can be right there: a dedicated line, a MID meter and the paperwork for the residents’ assembly — from 59.000 RSD VAT included, installed in one day. You pay for electricity at the price on your EPS bill, with no markup.§m7n4qj§Check your garage →"]);BVQ.push(["ru2","1wf3ia7§Публичные зарядки · Сербия§1wbuqvc§Карта зарядок для электромобилей§f8nbh5§Быстрые DC- и AC-зарядки на одной карте — с ценой сети, датой и источником.§19w49du§Карта зарядок для электромобилей в Сербии — с ценами | Evolako§kbrkuv§Как читать карту§th2gsx§Тёмный круг — быстрая DC-зарядка, синий — AC, а число в круге — мощность в кВт. Серый круг значит, что зарядка не работает или она только для Tesla. Бледный круг — зарядка, которая есть только в открытых базах: мы не нашли её ни в списке сети, ни в свежих оценках водителей, поэтому проверь её перед поездкой.§ay1nj1§Приблизь карту — и под зарядками появится цена за кВт·ч. Сети в основном берут плату за минуту, так что это оценка для типичной машины; точный прайс, дата и источник — в карточке зарядки.§1945ywb§Откуда данные§drhhgy§Зарядки взяты из открытых баз OpenStreetMap (ODbL) и Open Charge Map (CC BY 4.0), из списков сетей и JP «Putevi Srbije». Цены — из прайс-листов и приложений сетей, всегда с датой и источником. Базу ведёт§4zpbkj§— гид по электромобилям в Сербии от той же команды; карта обновляется раз в месяц. Если видишь ошибку, открой зарядку и нажми «Сообщить об ошибке».§15a2amz§Сколько стоит публичная зарядка§1u11sal§В пересчёте на кВт·ч быстрая (DC) зарядка в Сербии чаще всего выходит 60–70 RSD, а разброс — примерно 45–95 RSD в зависимости от сети, мощности зарядки и машины (прайс-листы сетей, сентябрь 2026). Дома ночью тот же кВт·ч стоит около 6 RSD со всеми сборами — как в калькуляторе на сайте.§1wlavls§Зарядка в гараже твоего дома§18xaj63§Если паркуешься в гараже дома, зарядка может быть прямо там: отдельная линия, счётчик MID и документы для собрания жильцов — от 59.000 RSD с НДС, монтаж за один день. За электричество платишь по цене из счёта EPS, без наценки.§m7n4qj§Проверь свой гараж →"]);
