# www.blokvolt.rs: every commit to main is built and deployed to the Cloudflare Pages project "blokvolt" (production).
# The same steps as scripts/pack.sh + RUNBOOK 5, without the browser. Secrets (repo Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN  — a token with "Account · Cloudflare Pages · Edit" only (created by the owner)
#   CLOUDFLARE_ACCOUNT_ID — the account id from the Cloudflare dashboard
# Bindings (D1 "DB"), variables and secrets of the worker stay as they are set on the Pages project in the dashboard.
# Security (26.10.2026): actions are pinned to commit hashes and wrangler to an exact version, so a hijacked tag or
# a poisoned npm release cannot reach the Cloudflare token. To update: take a release at least a week old
# (npm view wrangler time; git ls-remote --tags https://github.com/actions/<name>) and change the pins here.
# A commit whose message contains [skip deploy] is not deployed. Manual run: Actions → Deploy → Run workflow.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-blokvolt
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install
        run: |
          pip install -q jinja2 markdown beautifulsoup4 pillow
          bash scripts/fetch_fonts.sh >/dev/null
      - name: Build and check
        run: |
          python3 build.py
          python3 scripts/check_links.py
      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.151.0 pages deploy dist --project-name=blokvolt --branch=main
          --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --pretty=%s | cut -c1-300)" --commit-dirty=true
      - name: Newsletter tick (sends a new preview or an approved issue at once instead of at the next scheduled tick)
        continue-on-error: true
        run: sleep 20 && curl -fsS --max-time 100 -X POST https://www.blokvolt.rs/api/posta/tick
