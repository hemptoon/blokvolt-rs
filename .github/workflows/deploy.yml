# www.blokvolt.rs: every commit to main is built and deployed to the Cloudflare Pages project "blokvolt" (production).
# The same steps as scripts/pack.sh + RUNBOOK 5, without the browser. Secrets (repo Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN  — a token with "Account · Cloudflare Pages · Edit" only (created by the owner)
#   CLOUDFLARE_ACCOUNT_ID — the account id from the Cloudflare dashboard
# Bindings (D1 "DB"), variables and secrets of the worker stay as they are set on the Pages project in the dashboard.
# A commit whose message contains [skip deploy] is not deployed. Manual run: Actions → Deploy → Run workflow.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-blokvolt
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          pip install -q jinja2 markdown beautifulsoup4 pillow
          bash scripts/fetch_fonts.sh >/dev/null
      - name: Build and check
        run: |
          python3 build.py
          python3 scripts/check_links.py
      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy dist --project-name=blokvolt --branch=main
          --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --pretty=%s | cut -c1-300)" --commit-dirty=true
