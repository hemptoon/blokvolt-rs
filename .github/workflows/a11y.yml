# Accessibility of www.blokvolt.rs and www.evolako.rs (docs/RUNBOOK.md 3.41, since 09.11.2026). Part of the shared
# quality system of BlokVolt and Evolako: the morning QA review reads this workflow's badge next to the Site checks ones.
# Every night at 02:47 UTC and by hand: axe-core (WCAG 2.2 A/AA) on the key pages of both live sites in three
# languages, skip link, visible focus ring, no sideways scrolling at 320 px (scripts/qa/a11y_check.py).
# A failed run is e-mailed to the owner by GitHub. Nothing here deploys or changes anything.
name: Accessibility
on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a11y
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install (Playwright Chromium, axe-core 4.14)
        run: |
          pip install -q playwright==1.63.0
          python3 -m playwright install --with-deps chromium > /dev/null
          npm install --no-save --no-audit --no-fund axe-core@4.14 > /dev/null
      - name: Both live sites
        run: python3 scripts/qa/a11y_check.py
