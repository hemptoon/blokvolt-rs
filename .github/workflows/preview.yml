# Dev previews (RUNBOOK "Dev previews", bvcom README §3): every push to the branch dev or to a task branch (g<N>-…, k<N>-…)
# builds www.blokvolt.rs and blokvolt.com with the same checks as Deploy, makes both builds noindex and uploads them as
# PREVIEW deployments: blokvolt.rs → Cloudflare Pages project "blokvolt" (https://<branch>.blokvolt.pages.dev),
# blokvolt.com with the world layer → project "blokvolt-com" (https://<branch>.blokvolt-com.pages.dev; its production
# branch is "release" and nothing is deployed there until the owner decides to move the domain).
# Never production: main and release are refused below; no IndexNow, no newsletter, no D1 (preview deployments of
# "blokvolt" have no D1/AI bindings, so its API answers in demo mode). World data: hemptoon/blokvolt-tiles (GitHub Pages).
# Secrets and pins: the same as deploy.yml (token "Account · Cloudflare Pages · Edit", wrangler pinned).
name: Preview
on:
  push:
    branches: ['dev', 'g[0-9]*-*', 'k[0-9]*-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true
env:
  TILES: https://hemptoon.github.io/blokvolt-tiles
  # K7 only (even point density): this branch reads its own tiles folder; drop this line when K7 is merged and the folder
  # becomes latest.json of the tiles host
  BV_TILES_PATH: world/2026-11-09-k7/world.pmtiles
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse production branches
        run: case "${GITHUB_REF_NAME}" in main|release|region-data) echo "::error::preview never runs on ${GITHUB_REF_NAME}"; exit 1;; esac
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install
        run: |
          pip install -q jinja2 markdown beautifulsoup4 pillow babel
          bash scripts/fetch_fonts.sh >/dev/null
      - name: Build and check blokvolt.rs
        run: |
          python3 build.py
          python3 scripts/check_links.py
          python3 scripts/check_images.py
      - name: World data from the tiles host
        run: python3 scripts/dev_world_data.py "$TILES" "$RUNNER_TEMP/world" | tee -a "$GITHUB_ENV"
      - name: Build and check blokvolt.com with the world layer
        run: |
          python3 scripts/world_i18n.py selftest
          python3 scripts/world_map.py --selftest
          python3 scripts/world_pages.py selftest
          python3 scripts/world_shell.py selftest
          python3 scripts/world_prices_data.py validate
          python3 scripts/world_prices.py selftest
          python3 scripts/world_pay.py selftest
          python3 scripts/world_checkins.py --selftest
          python3 scripts/world_press.py selftest
          python3 content/world/names/check_names.py
          BV_WORLD_HOME=1 BV_WORLD_PREVIEW=1 BV_WORLD_PAGES="$PAGES" BV_WORLD_MANIFEST="$MANIFEST" BV_WORLD_DATA=/world-data/ python3 scripts/gen_com.py
          mkdir -p dist-com/world-data
          cp -r "$CARDS" dist-com/world-data/
          cp "$MANIFEST" dist-com/world-data/
          if [ -n "$PLACES" ]; then cp "$PLACES" dist-com/world-data/; fi
          printf '{"manifest": "%s"}' "$(basename "$MANIFEST")" > dist-com/world-data/latest.json
          python3 scripts/qa/world_pages_check.py dist-com "$PAGES" --report "$RUNNER_TEMP/world_pages_check.json"
          rm -f dist-com/CNAME
          echo "blokvolt.com files: $(find dist-com -type f | wc -l) (Cloudflare Pages Free: 20000)"
      - name: noindex for both previews
        run: python3 scripts/dev_noindex.py dist dist-com
      - name: Pages project blokvolt-com (created once)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4.151.0 pages project list 2>/dev/null | grep -q ' blokvolt-com '; then
            echo 'blokvolt-com exists'
          else
            npx --yes wrangler@4.151.0 pages project create blokvolt-com --production-branch=release
          fi
      - name: Deploy previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          msg="$(git log -1 --pretty=%s | cut -c1-300)"
          npx --yes wrangler@4.151.0 pages deploy dist-com --project-name=blokvolt-com --branch="$GITHUB_REF_NAME" \
            --commit-hash="$GITHUB_SHA" --commit-message="$msg" --commit-dirty=true | tee "$RUNNER_TEMP/com.txt"
          npx --yes wrangler@4.151.0 pages deploy dist --project-name=blokvolt --branch="$GITHUB_REF_NAME" \
            --commit-hash="$GITHUB_SHA" --commit-message="$msg" --commit-dirty=true | tee "$RUNNER_TEMP/rs.txt"
          {
            echo "### Dev previews of ${GITHUB_REF_NAME}"
            grep -ho 'https://[a-z0-9.-]*pages.dev[^ ]*' "$RUNNER_TEMP/com.txt" "$RUNNER_TEMP/rs.txt" | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
