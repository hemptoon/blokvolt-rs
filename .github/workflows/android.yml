# Builds the BlokVolt Android app (a Trusted Web Activity for www.blokvolt.rs) from android/.
# The outputs are UNSIGNED; they are signed outside GitHub with the owner's key (docs/RUNBOOK.md 3.20).
# Result: branch android-build, folder <versionName>-<versionCode>/ with app-release-unsigned.apk,
# app-release.aab and SHA256SUMS. Runs when android/ or this file changes on main, or by hand.
name: Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the unsigned release APK and App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease
      - name: Put the outputs on the android-build branch
        run: |
          set -e
          V="$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)-$(grep -oP 'versionCode \K\d+' android/app/build.gradle)"
          OUT="/tmp/out/$V"
          mkdir -p "$OUT"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$OUT"/
          cp android/app/build/outputs/bundle/release/app-release.aab "$OUT"/
          (cd "$OUT" && sha256sum app-release-unsigned.apk app-release.aab > SHA256SUMS && echo "source $GITHUB_SHA" >> SHA256SUMS)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch --depth=1 origin android-build 2>/dev/null; then
            git checkout -B android-build FETCH_HEAD
          else
            git checkout --orphan android-build
            git rm -rfq .
          fi
          rm -rf "$V"
          cp -r "$OUT" "$V"
          git add "$V"
          git commit -qm "Android build $V from ${GITHUB_SHA::7}"
          git push origin android-build
