<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ SITE }}{{ path if path != '/404.html' else '/404' }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BlokVolt">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ SITE }}{{ path }}">
<meta property="og:image" content="{{ SITE }}/assets/og/og-en.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B0F17">
{% if noindex %}<meta name="robots" content="noindex">
{% endif %}<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/onest-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/agg.css">
<link rel="stylesheet" href="/assets/com.css">
{% block jsonld %}{% endblock %}
</head>
<body>
<div class="v2-page agg com">{% include 'nav.html' %}{% block hero %}{% endblock %}{% block content %}{% endblock %}{% block cta %}{% endblock %}{% include 'footer.html' %}</div>

</html>
